name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PokeMan contracts and Map
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: loom-realm/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pokeman-pw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('loom-realm/package-lock.json') }}
      - name: Build LoomRealm packages and run PokeMan tests
        run: bash scripts/ci/run-pokeman.sh full
      - name: Verify verification tier contracts
        run: python3 -m unittest discover -s tests -p 'test_ci_layers.py' -v
